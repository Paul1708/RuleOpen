<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="docBg" x1="28" y1="28" x2="152" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5ECF5" />
    </linearGradient>
    <linearGradient id="docFold" x1="110" y1="28" x2="152" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4DFEC" />
      <stop offset="100%" stop-color="#BAC9DC" />
    </linearGradient>
    <linearGradient id="routePrimary" x1="68" y1="146" x2="228" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2899F5" />
      <stop offset="100%" stop-color="#0067C0" />
    </linearGradient>
    <linearGradient id="targetTile" x1="168" y1="138" x2="232" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38A8FF" />
      <stop offset="100%" stop-color="#005FB8" />
    </linearGradient>
    <linearGradient id="secondaryTile" x1="176" y1="54" x2="220" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8E3FA" />
      <stop offset="100%" stop-color="#8BC4F5" />
    </linearGradient>
    <filter id="softShadow" x="14" y="20" width="156" height="224" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <filter id="tileShadow" x="156" y="130" width="88" height="88" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#00458A" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Rounded Document Card -->
  <g filter="url(#softShadow)">
    <path d="M46 28 H110 L152 70 V208 C152 219.046 143.046 228 132 228 H46 C34.954 228 26 219.046 26 208 V48 C26 36.954 34.954 28 46 28 Z"
          fill="url(#docBg)" stroke="#9FB0C4" stroke-width="3" />
    <!-- Folded Corner -->
    <path d="M110 28 V54 C110 62.837 117.163 70 126 70 H152 L110 28 Z" fill="url(#docFold)" />
  </g>

  <!-- Subtle File Header Lines -->
  <rect x="46" y="64" width="44" height="10" rx="5" fill="#B8C7D9" />
  <rect x="46" y="86" width="66" height="10" rx="5" fill="#CBD7E6" />

  <!-- Secondary (Alternate) Route Branch -->
  <path d="M108 148 C134 148 134 76 164 76 H178"
        stroke="#7EC0F5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="176" y="54" width="44" height="44" rx="12" fill="url(#secondaryTile)" stroke="#62B0EF" stroke-width="2.5" />

  <!-- Origin Halo (underneath path) -->
  <circle cx="68" cy="148" r="18" fill="#FFFFFF" />

  <!-- Primary Selected Route & Origin Node -->
  <path d="M68 148 H120 C138 148 142 170 162 170 H174"
        stroke="url(#routePrimary)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="68" cy="148" r="13" fill="#0078D4" />

  <!-- Primary Target App Tile -->
  <g filter="url(#tileShadow)">
    <rect x="168" y="138" width="64" height="64" rx="16" fill="url(#targetTile)" />
    <path d="M193 156 L211 170 L193 184"
          stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
